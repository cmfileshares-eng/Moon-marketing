<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<title>Lunar · Client Portal — Moon Marketing</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,300;0,400;0,600;1,400&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet"/>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="https://apis.google.com/js/api.js"></script>
<script src="https://accounts.google.com/gsi/client" async defer></script>

<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  --orange:#FF6B2C;--orange-l:#FFF0E9;--orange-m:#FFD5BC;
  --amber:#F5A623;--amber-l:#FFF8E6;
  --green:#2ECC8F;--green-l:#E8FAF3;
  --blue:#4A8FD4;--blue-l:#EAF2FB;
  --red:#E5534B;--red-l:#FEECEB;
  --purple:#8B5CF6;--purple-l:#F3EEFF;
  --white:#FFFFFF;--off:#F8F7F5;--border:#EDEBE7;
  --ink:#1C1917;--muted:#9C958F;
  --radius:20px;--radius-sm:14px;--radius-xs:10px;
  --shadow:0 2px 16px rgba(0,0,0,.06);
  --shadow-lg:0 8px 40px rgba(0,0,0,.10);
  --font-body:'DM Sans',sans-serif;
  --font-display:'Fraunces',serif;
}
html{scroll-behavior:smooth}
body{font-family:var(--font-body);background:var(--off);color:var(--ink);min-height:100vh;overflow-x:hidden}
.hidden{display:none!important}

/* ── LOADING SCREEN ── */
#loading-screen{position:fixed;inset:0;z-index:1000;background:var(--white);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px}
.loader-orb{width:52px;height:52px;background:var(--orange);border-radius:50%;animation:pulse 1.4s ease-in-out infinite}
.loader-name{font-family:var(--font-display);font-size:22px;font-weight:600;color:var(--ink)}
@keyframes pulse{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(.85);opacity:.6}}

/* ── AUTH ── */
#auth-screen{position:fixed;inset:0;z-index:900;background:var(--white);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;animation:fadeIn .3s ease}
.auth-brand{display:flex;align-items:center;gap:10px;margin-bottom:32px}
.brand-orb{width:42px;height:42px;background:var(--orange);border-radius:50%;display:flex;align-items:center;justify-content:center}
.brand-orb svg{width:20px;height:20px;fill:white}
.brand-name{font-family:var(--font-display);font-size:26px;font-weight:600}
.auth-card{width:100%;max-width:380px;background:var(--white);border-radius:28px;padding:32px 28px;box-shadow:var(--shadow-lg)}
.auth-card h2{font-family:var(--font-display);font-size:24px;font-weight:400;margin-bottom:6px}
.auth-card h2 em{font-style:italic;color:var(--orange)}
.auth-card p{color:var(--muted);font-size:14px;margin-bottom:24px}
.field{width:100%;padding:13px 16px;border:1.5px solid var(--border);border-radius:var(--radius-sm);font-family:var(--font-body);font-size:15px;color:var(--ink);background:var(--white);outline:none;transition:border .2s;margin-bottom:11px;-webkit-appearance:none}
.field:focus{border-color:var(--orange)}
.btn-primary{width:100%;padding:14px;background:var(--orange);color:white;border:none;border-radius:var(--radius-sm);font-family:var(--font-body);font-size:15px;font-weight:600;cursor:pointer;transition:all .2s;margin-bottom:14px}
.auth-err{font-size:12px;color:var(--red);margin-top:-6px;margin-bottom:8px;min-height:16px}

/* ── TOPBAR ── */
#app{display:none;flex-direction:column;min-height:100vh;padding-bottom:80px}
.topbar{position:sticky;top:0;z-index:200;background:rgba(248,247,245,.93);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);padding:12px 16px 10px;border-bottom:1px solid var(--border)}
.topbar-row1{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.topbar-brand{display:flex;align-items:center;gap:8px}
.topbar-orb{width:32px;height:32px;background:var(--orange);border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.topbar-orb svg{width:15px;height:15px;fill:white}
.topbar-name{font-family:var(--font-display);font-size:18px;font-weight:600}
.topbar-actions{display:flex;align-items:center;gap:8px}
.icon-pill{width:38px;height:38px;border-radius:50%;border:1.5px solid var(--border);background:var(--white);display:flex;align-items:center;justify-content:center;cursor:pointer;position:relative;transition:all .2s}
.icon-pill svg{width:18px;height:18px;stroke:var(--ink);fill:none;stroke-width:2}
.avatar-pill{width:38px;height:38px;border-radius:50%;background:linear-gradient(135deg,var(--orange),var(--amber));display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;color:white;cursor:pointer;flex-shrink:0}

/* ── PAGE / BUBBLE ── */
.page{padding:16px}
.bubble{background:var(--white);border-radius:var(--radius);padding:20px;box-shadow:var(--shadow);margin-bottom:14px}
.btn-row{display:flex;gap:10px;margin-top:8px}
.btn-cancel{flex:1;padding:13px;border:1.5px solid var(--border);border-radius:var(--radius-sm);background:none;font-family:var(--font-body);font-size:14px;cursor:pointer;color:var(--ink)}

/* ── CHAT ── */
#chat-screen{display:none;position:fixed;inset:0;z-index:260;background:var(--off);flex-direction:column}
#chat-screen.open{display:flex}
.chat-topbar{display:flex;align-items:center;gap:12px;padding:12px 16px;background:var(--white);border-bottom:1px solid var(--border);flex-shrink:0}
.chat-messages{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:10px}
.chat-bubble-wrap{display:flex;flex-direction:column;gap:3px}
.chat-bubble-wrap.mine{align-items:flex-end}
.chat-bubble-wrap.theirs{align-items:flex-start}
.chat-bubble{max-width:78%;padding:10px 14px;border-radius:18px;font-size:14px;line-height:1.5}
.chat-bubble.mine{background:var(--orange);color:white;border-bottom-right-radius:4px}
.chat-bubble.theirs{background:var(--white);color:var(--ink);border-bottom-left-radius:4px;box-shadow:var(--shadow)}
.chat-input-bar{display:flex;gap:8px;padding:12px 16px;background:var(--white);border-top:1px solid var(--border);flex-shrink:0}
.chat-input{flex:1;padding:11px 16px;border:1.5px solid var(--border);border-radius:40px;outline:none}

/* ── MODAL ── */
#modal-overlay{position:fixed;inset:0;z-index:500;background:rgba(0,0,0,.4);backdrop-filter:blur(4px);display:none;align-items:flex-end}
#modal-overlay.open{display:flex}
.modal-sheet{width:100%;max-height:92vh;background:var(--white);border-radius:28px 28px 0 0;padding:20px 20px calc(24px + env(safe-area-inset-bottom));overflow-y:auto;animation:slideUp .3s cubic-bezier(.22,1,.36,1)}

/* ── ADMIN PORTAL ── */
#admin-app{display:none;position:fixed;inset:0;z-index:700;background:var(--off);flex-direction:column}
#admin-app.open{display:flex}

/* ── TOAST ── */
#toast{position:fixed;bottom:100px;left:50%;transform:translateX(-50%);background:var(--ink);color:white;padding:12px 22px;border-radius:40px;font-size:14px;z-index:999;opacity:0;transition:opacity .25s;pointer-events:none}
#toast.show{opacity:1}

@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes slideUp{from{opacity:0;transform:translateY(40px)}to{opacity:1;transform:translateY(0)}}
</style>
</head>
<body>

<div id="loading-screen">
  <div class="loader-orb"></div>
  <div class="loader-name">Lunar</div>
</div>

<div id="auth-screen" class="hidden">
  <div class="auth-card">
    <div id="client-auth-card">
      <h2>Welcome back<br><em>☽</em></h2>
      <p>Sign in to your portal</p>
      <input class="field" id="si-email" type="email" placeholder="Email address"/>
      <input class="field" id="si-pass" type="password" placeholder="Password"/>
      <div class="auth-err" id="si-err"></div>
      <button class="btn-primary" onclick="signIn()">Sign In →</button>
      <button style="width:100%; background:none; border:none; color:var(--muted); font-size:12px; cursor:pointer;" onclick="showAdminAuth()">Admin Portal Access</button>
    </div>

    <div id="admin-auth-card" style="display:none">
      <h2>Admin Login</h2>
      <input class="field" id="ai-email" type="email" placeholder="Admin email"/>
      <input class="field" id="ai-pass" type="password" placeholder="Password"/>
      <div class="auth-err" id="ai-err"></div>
      <button class="btn-primary" onclick="adminSignIn()" style="background:var(--ink)">Login as Admin</button>
      <button style="width:100%; background:none; border:none; color:var(--muted); font-size:12px; cursor:pointer;" onclick="showClientAuth()">Back to Client Portal</button>
    </div>
  </div>
</div>

<div id="app">
  <div class="topbar">
    <div class="topbar-row1">
      <div class="topbar-brand"><div class="topbar-name">Lunar</div></div>
      <div class="topbar-actions">
        <div class="avatar-pill" id="avatar-pill" onclick="confirmSignOut()">?</div>
      </div>
    </div>
  </div>
  <div class="page">
    <div class="bubble">
      <h3>Messages</h3>
      <p id="chat-preview-text" style="font-size:13px; color:var(--muted);">No messages yet.</p>
      <button class="btn-primary" onclick="openChat()" style="margin-top:12px">Open Chat</button>
    </div>
  </div>
</div>

<div id="admin-app">
  <div style="padding:20px; background:var(--white); border-bottom:1px solid var(--border);">
    <div style="display:flex; justify-content:space-between; align-items:center;">
      <h2>Admin Dashboard</h2>
      <div class="avatar-pill" onclick="confirmSignOut()">A</div>
    </div>
  </div>
  <div style="padding:20px;">
    <p style="margin-bottom:12px;">Active Client Rooms:</p>
    <div id="admin-client-list"></div>
  </div>
</div>

<div id="chat-screen">
  <div class="chat-topbar">
    <button onclick="closeChat()" style="background:none; border:none; font-size:20px; cursor:pointer; padding:10px;">←</button>
    <div id="chat-title">Chat</div>
  </div>
  <div class="chat-messages" id="chat-messages"></div>
  <div class="chat-input-bar">
    <input class="chat-input" id="chat-input" type="text" placeholder="Type a message..."/>
    <button onclick="sendMessage()" style="padding:10px 20px; background:var(--orange); color:white; border:none; border-radius:20px; cursor:pointer;">Send</button>
  </div>
</div>

<div id="modal-overlay" onclick="if(event.target===this)closeModal()">
  <div class="modal-sheet" id="modal-content"></div>
</div>

<div id="toast"></div>

<script>
const SUPABASE_URL  = 'https://onxodaeoqvttrazzklgn.supabase.co';
const SUPABASE_ANON = 'sb_publishable_mq-p3HHfwzropQeceoQVGw_Ci92qFEd';
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON);

let currentUser = null;
let isAdminUser = false;
let chatRoomId = null;
let chatSubscription = null;

/* BOOT & ROUTING */
async function boot() {
  const { data: { session } } = await sb.auth.getSession();
  hide('loading-screen');
  if (session) {
    currentUser = session.user;
    await routeUser();
  } else {
    show('auth-screen');
  }
}

async function routeUser() {
  hide('auth-screen');
  const { data: adminCheck } = await sb.from('admins').select('id').eq('id', currentUser.id).maybeSingle();

  if (adminCheck) {
    isAdminUser = true;
    show('admin-app');
    hide('app');
    loadAdminClientList();
  } else {
    isAdminUser = false;
    show('app');
    hide('admin-app');
    updateAvatar();
  }
}

/* AUTH FUNCTIONS */
async function signIn() {
  const { error } = await sb.auth.signInWithPassword({ email: v('si-email'), password: v('si-pass') });
  if (error) document.getElementById('si-err').textContent = error.message;
}

async function adminSignIn() {
  const { error } = await sb.auth.signInWithPassword({ email: v('ai-email'), password: v('ai-pass') });
  if (error) document.getElementById('ai-err').textContent = error.message;
}

function confirmSignOut() {
  const content = document.getElementById('modal-content');
  content.innerHTML = `
    <div style="text-align:center; padding:10px;">
      <h3>Sign Out?</h3>
      <p style="color:var(--muted); margin-bottom:20px;">Are you sure you want to end your session?</p>
      <div class="btn-row">
        <button class="btn-cancel" onclick="closeModal()">Keep Session</button>
        <button class="btn-primary" style="background:var(--red); margin:0;" onclick="executeSignOut()">Sign Out</button>
      </div>
    </div>`;
  document.getElementById('modal-overlay').classList.add('open');
}

async function executeSignOut() {
  await sb.auth.signOut();
  location.reload();
}

/* CHAT LOGIC */
async function openChat(customRoomId = null) {
  chatRoomId = customRoomId || currentUser.id;
  document.getElementById('chat-screen').classList.add('open');
  await loadMessages();
  subscribeToMessages();
}

async function loadMessages() {
  const { data } = await sb.from('messages').select('*').eq('room_id', chatRoomId).order('created_at', { ascending: true });
  renderMessages(data || []);
}

function renderMessages(msgs) {
  const container = document.getElementById('chat-messages');
  container.innerHTML = msgs.map(m => {
    const isMine = isAdminUser ? (m.sender === 'admin') : (m.sender === 'client');
    return `<div class="chat-bubble-wrap ${isMine?'mine':'theirs'}">
      <div class="chat-bubble ${isMine?'mine':'theirs'}">${m.body}</div>
    </div>`;
  }).join('');
  container.scrollTop = container.scrollHeight;
}

async function sendMessage() {
  const body = v('chat-input');
  if (!body) return;
  document.getElementById('chat-input').value = '';

  await sb.from('messages').insert({
    room_id: chatRoomId,
    sender: isAdminUser ? 'admin' : 'client',
    body: body
  });
}

function subscribeToMessages() {
  if (chatSubscription) chatSubscription.unsubscribe();
  chatSubscription = sb.channel('chat-room').on('postgres_changes', { 
    event: 'INSERT', schema: 'public', table: 'messages', filter: `room_id=eq.${chatRoomId}` 
  }, payload => {
    loadMessages();
  }).subscribe();
}

function closeChat() { document.getElementById('chat-screen').classList.remove('open'); }

/* ADMIN DATA */
async function loadAdminClientList() {
  const { data } = await sb.from('clients').select('*');
  document.getElementById('admin-client-list').innerHTML = (data || []).map(c => `
    <div class="bubble" onclick="openChat('${c.id}')" style="cursor:pointer;">
      <strong>${c.name}</strong><br><small>${c.email}</small>
    </div>`).join('');
}

/* UTILS */
function v(id) { return document.getElementById(id).value.trim(); }
function show(id) { document.getElementById(id).classList.remove('hidden'); document.getElementById(id).style.display = 'flex'; }
function hide(id) { document.getElementById(id).style.display = 'none'; }
function closeModal() { document.getElementById('modal-overlay').classList.remove('open'); }
function updateAvatar() { document.getElementById('avatar-pill').textContent = currentUser.email.charAt(0).toUpperCase(); }

boot();
</script>
</body>
</html>
